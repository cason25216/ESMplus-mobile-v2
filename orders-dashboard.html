function home(){const d=dashboardData[dashboardRange],compare=comparisonLabel();return orderOverview()+taskBanner()+'<div class="section-head"><h2>'+tr('经营概览','Store overview','스토어 현황')+'</h2><span class="muted">'+tr('更新于 14:00 KST','Updated 14:00 KST','14:00 KST 업데이트')+'</span></div><div class="date-tabs" role="group" aria-label="'+tr('数据时间范围','Data period','데이터 기간')+'">'+[['today',tr('今日','Today','오늘')],['week',tr('近7天','Last 7 days','최근 7일')],['month',tr('近1个月','Last month','최근 1개월')]].map(([id,label])=>'<button aria-pressed="'+(dashboardRange===id)+'" class="'+(dashboardRange===id?'active':'')+'" onclick="setDashboardRange(\''+id+'\')">'+label+'</button>').join('')+'</div><p class="period-caption">'+d.dates+'</p><div class="metrics" aria-live="polite">'+metric(tr('成交金额 GMV','GMV','거래액 GMV'),money(d.gmv),'↗ '+d.deltas[0]+' '+compare)+metric(tr('支付订单','Paid orders','결제 주문'),d.orders.toLocaleString('en-US'),'↗ '+d.deltas[1]+' '+compare)+metric(tr('商品访客','Product visitors','상품 방문자'),d.visitors.toLocaleString('en-US'),'↗ '+d.deltas[2]+' '+compare)+metric(tr('支付转化率','Payment conversion','결제 전환율'),d.conversion,'↗ '+d.deltas[3]+' pp '+compare)+'</div><div class="grid"><div class="card"><div class="topline"><h3>'+tr('成交趋势','GMV trend','거래액 추이')+'</h3><span class="pill">'+rangeLabel()+'</span></div><div class="legend"><span><i></i>'+tr('所选时段','Selected period','선택 기간')+'</span><span><i class="gray"></i>'+tr('对比时段','Comparison period','비교 기간')+'</span></div>'+dashboardChart()+'<p class="muted chart-note">'+(dashboardRange==='today'?tr('今日按小时查看；与昨日截至14:00的同等时段比较。','Hourly view today; compared with yesterday up to 14:00.','오늘 시간대별 추이 · 어제 14시까지의 동일 시간대와 비교합니다.'):tr('近7天、近1个月均不含今日；近1个月按最近30个完整自然日统计。趋势为每日成交额，月份视图抽样展示。','Completed days only; last month means the latest 30 full days. Trend shows daily GMV, sampled in the monthly view.','오늘 제외 · 최근 1개월은 완료된 30일 기준입니다. 일별 거래액 추이이며 월간 보기는 일부 날짜를 표시합니다.'))+'</p></div><div class="card"><div class="topline"><h3>'+tr('活动动态','Campaign update','캠페인 소식')+'</h3><span class="pill">DAILY BRIEF</span></div><div class="task"><div class="icon">▤</div><div><h3>'+tr('秋日焕新 · 昨日战报','Autumn Refresh · Daily brief','가을 리프레시 · 어제 성과')+'</h3><p class="muted">'+tr('活动成交额增长 24.8%','Campaign GMV grew 24.8%','캠페인 거래액 24.8% 증가')+'</p></div><button aria-label="'+tr('查看日报','View daily report','일일 리포트 보기')+'" onclick="go(\'daily\')">↗</button></div></div></div><p class="demo">'+tr('所有任务及经营指标均为演示数据；时间统一为韩国时间。','All tasks and business metrics are simulated. All times are KST.','모든 할 일과 운영 지표는 데모 데이터이며 시간은 KST 기준입니다.')+'</p>'+orderDemoControls()}


function campaignForecastMarkup(){return '<section class="forecast campaign-forecast" aria-label="'+tr('活动整体预估','Campaign forecast','캠페인 전체 예상 성과')+'"><div class="forecast-title">'+tr('活动整体预计增量','Estimated campaign uplift','캠페인 전체 예상 증가')+'<small>Nov 1–7</small></div><div class="forecast-grid"><div><label>'+tr('预计新增曝光量','Additional impressions','예상 추가 노출')+'</label><strong>+7,000</strong></div><div><label>'+tr('预计新增订单量','Additional orders','예상 추가 주문')+'</label><strong>+72</strong></div></div><p class="forecast-disclaimer">'+tr('基于本店3件推荐商品的活动全周期示例预估，对比不参加活动的同周期基线。非效果保证；勾选或修改价格不会重新计算。','Illustrative full-campaign uplift for this store’s 3 recommended products, versus not participating. Not guaranteed; selection and price edits do not recalculate this estimate.','스토어 추천 상품 3개의 행사 전체 기간 예시 증가분입니다. 미참여 시 대비이며 실제 성과를 보장하지 않습니다. 선택 및 가격 수정 시 재계산되지 않습니다.')+'</p></section>'}

function sale(){const c=campaignList.find(c=>c.id===activeCampaign);return '<label class="campaign-selector">'+tr('当前活动','Campaign','현재 캠페인')+'<select aria-label="Campaign" onchange="switchCampaign(this.value)">'+campaignList.map(x=>'<option value="'+x.id+'" '+(x.id===activeCampaign?'selected':'')+'>'+x.name+'</option>').join('')+'</select></label>'+baseSale().replaceAll('Nov Big Smile Day',c.name).replaceAll('NOV BIG SMILE DAY',c.name.toUpperCase()).replaceAll('2026.11.01 — 11.07',c.dates).replaceAll('10.29',c.deadline).replaceAll('Nov 1–7',activeCampaign==='big-smile'?'Nov 1–7':'Nov 6–8').replaceAll('+7,000',c.forecast).replaceAll('+72',c.orders)}function baseSale(){return `<div class="card campaign-intro"><div class="topline"><span class="pill">ϟ 招商中 · NOV BIG SMILE DAY</span><span class="muted">报名截止 10.29</span></div><h2 style="margin:17px 0 8px">Nov Big Smile Day</h2><p class="muted">活动时间 2026.11.01 — 11.07 · Gmarket Campaign 会场</p><details class="campaign-rules"><summary>报名要求与优惠规则</summary><div class="notice">✓ 近30日评分 ≥ 4.5　✓ 可售库存 ≥ 50 件<br>✓ 活动到手价需低于商品报名上限　✓ SD 与 SV 由商家承担</div><div class="muted">以下商品满足评分与库存要求。建议方案已预填，请核对价格与优惠后报名。<br>优惠演示规则：到手价 = 活动售价 × (1 − SD%) × (1 − SV%)，四舍五入至韩元。</div></details></div>${campaignForecastMarkup()}<div class="tabs"><button class="${saleTab==='eligible'?'active':''}" onclick="saleTab='eligible';render()">可报名商品 · ${state.enrolled?3-state.enrolled.length:3}</button><button class="${saleTab==='enrolled'?'active':''}" onclick="saleTab='enrolled';render()">已报名 · ${state.enrolled?state.enrolled.length:0}</button></div>${saleTab==='enrolled'?enrolled():eligible()}`}
function eligible(){const list=products.filter(p=>!state.enrolled?.some(e=>e.id===p.id));if(!list.length)return `<div class="card empty"><div class="success-icon" style="margin:0 auto 15px">✓</div><h2>报名已完成</h2><p class="muted">你的商品已加入 Nov Big Smile Day。</p><button class="btn secondary" onclick="saleTab='enrolled';render()">查看报名结果</button></div>`;return `<div class="topline" style="margin-bottom:12px"><label class="muted"><input type="checkbox" aria-label="全选商品" ${list.every(p=>selected.has(p.id))?'checked':''} onchange="toggleAll(this.checked)"> 全选可报名商品</label><span class="muted">可自行调整建议方案</span></div><div class="products">${list.map(p=>`<article class="card product"><div class="product-art ${p.color}">${p.art}</div><div><h3>${p.name}</h3><div class="sku">${p.id} · 库存 ${p.stock}</div><span class="muted">日常售价 ${money(p.base)}</span></div><input type="checkbox" aria-label="选择${p.name}" ${selected.has(p.id)?'checked':''} onchange="toggle('${p.id}',this.checked)"><div class="fields">${[['price','活动售价 ₩',1,p.base],['sd','SD 商家直降 %',0,50],['sv','SV 商家券 %',0,30]].map(([key,label,min,max])=>`<label>${label}<input aria-label="${p.name} ${label}" type="number" min="${min}" max="${max}" step="1" value="${p[key]}" oninput="edit('${p.id}','${key}',this.value)"></label>`).join('')}</div><div class="calc"><span>预计买家到手价 <b id="final-${p.id}">${money(finalPrice(p))}</b></span><span class="muted">报名上限 ${money(p.max)}</span></div><div class="error" id="error-${p.id}"></div></article>`).join('')}</div><div class="enroll-bar"><div><b id="selected-count">已选 ${list.filter(p=>selected.has(p.id)).length} 件商品</b><div class="muted">确认即提交价格与优惠方案</div></div><button class="btn" onclick="confirmEnroll()">一键确认报名 →</button></div><div class="demo">演示说明：不会修改真实商品或提交到 Gmarket。真实上线时需对接招商资格、优惠叠加及报名接口。</div>`}
function enrolled(){return state.enrolled?.length?`<div class="notice">✓ 报名成功 · 方案已保存于本浏览器 · 活动尚未开始</div><div class="products">${state.enrolled.map(p=>`<div class="card product"><div class="product-art ${p.color}">${p.art}</div><div><h3>${p.name}</h3><p class="muted">${p.id} · 活动售价 ${money(p.price)}<br>SD ${p.sd}% · SV ${p.sv}%</p><b>${money(finalPrice(p))}</b> <span class="muted">预计到手价</span></div><span class="pill">已报名</span></div>`).join('')}</div>`:`<div class="card empty"><h2>还没有报名商品</h2><p class="muted">查看平台推荐商品，开始你的下一场活动。</p><button class="btn" onclick="saleTab='eligible';render()">去报名</button></div>`}
function toggle(id,v){v?selected.add(id):selected.delete(id);document.getElementById('selected-count').textContent='已选 '+products.filter(p=>selected.has(p.id)&&!state.enrolled?.some(e=>e.id===p.id)).length+' 件商品';localize()}function toggleAll(v){products.forEach(p=>v?selected.add(p.id):selected.delete(p.id));render()}function valid(p){return Number.isFinite(p.price)&&p.price>0&&p.price<=p.base&&Number.isInteger(p.price)&&Number.isInteger(p.sd)&&p.sd>=0&&p.sd<=50&&Number.isInteger(p.sv)&&p.sv>=0&&p.sv<=30&&finalPrice(p)<=p.max}function edit(id,k,v){let p=products.find(p=>p.id===id);p[k]=v===''?NaN:Number(v);document.getElementById('final-'+id).textContent=Number.isFinite(finalPrice(p))?money(finalPrice(p)):'—';document.getElementById('error-'+id).textContent=valid(p)?'':translate('请检查整数价格与优惠范围，并确保到手价不超过报名上限。')}
function confirmEnroll(){const list=products.filter(p=>selected.has(p.id)&&!state.enrolled?.some(e=>e.id===p.id));if(!list.length)return toast('请至少选择一件商品');if(list.some(p=>!valid(p)))return toast('部分商品方案未达报名要求，请调整后重试');document.getElementById('overlay').innerHTML=`<div class="modal-back" role="dialog" aria-modal="true" aria-label="确认报名"><div class="modal"><span class="pill">确认活动方案</span><h2 style="margin-top:18px">为 ${list.length} 件商品报名？</h2><p>活动：${campaignList.find(c=>c.id===activeCampaign).name}<br>活动时间：${campaignList.find(c=>c.id===activeCampaign).dates}<br>商家承担 SD 直降与 SV 商家券优惠。</p>${list.map(p=>`<div class="topline" style="margin:12px 0;font-size:12px"><span>${p.name}</span><b>${money(finalPrice(p))}</b></div>`).join('')}<p>这是交互演示，确认后仅在本浏览器保存。</p><button class="btn" onclick="submitEnroll()">确认方案，立即报名</button><button class="btn secondary" onclick="closeModal()">返回调整</button></div></div>`;localize();document.querySelector('.modal .btn').focus()}
function closeModal(){document.getElementById('overlay').innerHTML=''}function submitEnroll(){const list=products.filter(p=>selected.has(p.id)&&!state.enrolled?.some(e=>e.id===p.id));state.enrolled=[...(state.enrolled||[]),...list.map(p=>({...p}))];save();saleTab='enrolled';closeModal();render();toast('报名成功！可在「已报名」查看商品方案')}
function reports(){return `<div class="tabs report-tabs"><button class="${reportTab==='daily'?'active':''}" onclick="reportTab='daily';render()">活动日报</button><button class="${reportTab==='summary'?'active':''}" onclick="reportTab='summary';render()">活动复盘</button></div>`+(reportTab==='daily'?daily():summary())}function daily(){const yesterday=reportDay==='25';return `<div class="topline" style="margin-bottom:18px"><span class="pill">秋日焕新 Flash Sale · 进行中</span><select aria-label="选择日报日期" onchange="reportDay=this.value;render()"><option value="25" ${yesterday?'selected':''}>10月25日 · 昨日</option><option value="24" ${!yesterday?'selected':''}>10月24日</option></select></div><div class="report-hero"><div class="eyebrow">YOUR DAILY FLASH BRIEF · 10.${reportDay}</div><h2>${yesterday?'流量正在转化为订单，<br>昨日表现稳步向上。':'活动热度持续攀升，<br>核心商品贡献突出。'}</h2><p class="muted">秋日焕新 · 10.23—10.29　/　第 ${yesterday?'3':'2'} 天<br>日报于次日 09:00 KST 更新</p></div><div class="report-grid">${metric('活动成交额',yesterday?'₩684,200':'₩548,237',yesterday?'↗ 24.8% 较前日':'↗ 16.2% 较前日')}${metric('活动支付订单',yesterday?'42':'35',yesterday?'↗ 20.0% 较前日':'↗ 16.7% 较前日')}${metric('活动支付转化率',yesterday?'4.82%':'4.46%',yesterday?'↗ 0.36 个百分点':'↗ 0.21 个百分点')}</div><div class="grid"><div class="card"><div class="topline"><h3>商品成交贡献</h3><span class="muted">GMV 占比</span></div>${[['纯棉短袖',yesterday?48:42],['通勤帆布包',yesterday?32:35],['休闲运动鞋',yesterday?20:23]].map(([n,v])=>`<div class="bar-row"><span>${n}</span><div class="bar-track"><b style="width:${v}%"></b></div><b>${v}%</b></div>`).join('')}<p class="muted" style="margin-top:25px">统计口径：活动归因的已支付金额，未扣除后续退款。</p></div><div class="card"><span class="pill">经营建议</span><h3 style="margin-top:17px">让畅销款保持竞争力</h3><p class="insight">${yesterday?'纯棉短袖贡献 48% 活动成交额，当前库存 68 件。按昨日销量估算可售约 2.4 天，建议优先检查补货计划。':'通勤帆布包的访客持续增长。建议关注商品详情页转化，并在下一次调整前核对优惠成本。'}</p><div class="notice">数据观察，仅供经营参考。<br>本期优惠方案保持不变。</div></div></div><div class="demo">日报对应「秋日焕新」演示活动；新报名的「Nov Big Smile Day」将在开场后生成日报。</div>`}
function summary(){return `<div class="topline" style="margin-bottom:18px"><span class="pill">活动已结束</span><button class="text-btn" onclick="downloadReport()">↓ 导出活动总结</button></div><div class="report-hero"><div class="eyebrow">CAMPAIGN WRAP-UP / OCTOBER</div><h2>7 天闪购，<br>收获一份值得延续的增长。</h2><p class="muted">10月生活好物 Flash Sale · 2026.10.12 — 10.18<br>报告生成：10月19日 09:00 KST</p></div><div class="metrics">${metric('活动累计成交额','₩4,862,000','↗ 32.6% 较活动前7天')}${metric('支付订单','312','↗ 28.4% 较活动前7天')}${metric('活动商品访客','8,964','↗ 22.1% 较活动前7天')}${metric('退款金额','₩146,000','占支付金额 3.0%',true)}</div><div class="grid"><div class="card"><h3>目标完成情况</h3><div class="topline" style="margin-top:22px"><span class="muted">成交目标 ₩6,200,000</span><b>78.4%</b></div><div class="progress"><b></b></div><p class="muted">距离目标还差 ₩1,338,000。<br>活动成交较前期提升，但未达到预设目标。</p><div class="section-head"><h3>商品表现</h3><span class="muted">成交金额</span></div>${[['纯棉短袖',54,'₩2,625,480'],['通勤帆布包',29,'₩1,409,980'],['休闲运动鞋',17,'₩826,540']].map(([n,v,m])=>`<div class="topline" style="padding:15px 0;border-top:1px solid var(--line);font-size:12px"><span>${n} <span class="muted">${v}%</span></span><b>${m}</b></div>`).join('')}</div><div class="card"><span class="pill">NEXT OPPORTUNITY</span><h3 style="margin-top:18px">下一场，可以做得更好</h3><p class="insight">① 提前备货<br><span class="muted">短袖在活动末期库存偏低，下期优先增加畅销尺码备货。</span></p><p class="insight">② 复核优惠投入<br><span class="muted">成交增长不等于利润增长，报名时核对 SD 与 SV 的叠加成本。</span></p><p class="insight">③ 承接新一轮流量<br><span class="muted">Nov Big Smile Day已开放招商，3 件商品满足基础要求。</span></p><button class="btn" style="width:100%;margin-top:8px" onclick="go('sale')">查看下一场机会 ↗</button></div></div><div class="demo">对比口径：活动期间与活动前连续7天、相同商品范围。成交额为支付口径；退款金额截至报告生成时间。此原型未提供利润测算。</div>`}
function downloadReport(){const text=translate('ESM+ Flash Sale 活动总结\n活动：10月生活好物\n时间：2026.10.12—10.18\n成交金额：KRW 4,862,000\n订单：312\n商品访客：8,964\n退款金额：KRW 146,000\n目标完成：78.4%\n对比：活动前连续7天，相同商品范围\n建议：补充畅销尺码库存；复核SD与SV成本；关注下一期招商。\n全部为演示数据。');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+text],{type:'text/plain;charset=utf-8'}));a.download='ESM-Flash-Sale-20261018.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('活动总结已导出')}document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeMenu()};if(e.key==='Tab'&&document.querySelector('.modal')){const b=[...document.querySelectorAll('.modal button')];if(e.shiftKey&&document.activeElement===b[0]){e.preventDefault();b.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===b.at(-1)){e.preventDefault();b[0].focus()}}});render();
</script></body></html>
